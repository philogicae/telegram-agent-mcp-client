name: telegram-agent-mcp-client

x-dns: &default-dns
  dns:
    - 127.0.0.11 # Docker embedded DNS
    - 9.9.9.9
    - 149.112.112.112
    - 2620:fe::fe
    - 2620:fe::9

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-networks: &default-networks
  networks:
    - ai-agent

networks:
  ai-agent:
    name: ai-agent
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
        - subnet: fd28:489c:c1d1::/64
          gateway: fd28:489c:c1d1::1

services:
  transmission:
    container_name: transmission
    image: lscr.io/linuxserver/transmission:4.0.6 # until latest is fixed
    restart: unless-stopped
    #ports: # Not needed on host
    #  - 9091:9091 # Web UI port
    #  - 51413:51413 # Torrent port (TCP)
    #  - 51413:51413/udp # Torrent port (UDP)
    env_file:
      - docker-envs/transmission.env
    environment:
      - USER=${TRANSMISSION_USER:-}
      - PASS=${TRANSMISSION_PASS:-}
      - DOCKER_MODS="linuxserver/mods:transmission-floodui|linuxserver/mods:transmission-transmissionic"
    volumes:
      - transmission_config:/config
      - transmission_watch:/watch # change to your watch directory (Optional)
      - ${TRANSMISSION_DOWNLOAD_DIR:-/downloads}:/downloads # Set via env var TRANSMISSION_DOWNLOAD_DIR
    <<: [*default-dns, *default-logging]
    network_mode: host # required for UPnP
    deploy:
      replicas: ${TRANSMISSION_ENABLE:-1}

  # MCP services
  transmission-mcp:
    container_name: transmission-mcp
    image: philogicae/transmission-mcp:latest
    pull_policy: always
    command: transmission-mcp --mode sse
    restart: unless-stopped
    init: true
    ports:
      - 8006:8000
    env_file:
      - docker-envs/transmission.env
    <<: [*default-dns, *default-logging, *default-networks]

  torrent-search-api:
    container_name: torrent-search-api
    image: philogicae/torrent-search-mcp:latest
    restart: unless-stopped
    init: true
    ports:
      - 8004:8000
    command: ["torrent-search-mcp", "--mode", "fastapi"]
    env_file:
      - path: docker-envs/torrent_search.env
        required: false
    <<: [*default-dns, *default-logging, *default-networks]

  torrent-search-mcp:
    container_name: torrent-search-mcp
    image: philogicae/torrent-search-mcp:latest
    pull_policy: always
    command: torrent-search-mcp --mode http
    restart: unless-stopped
    init: true
    depends_on:
      torrent-search-api:
        condition: service_started
    ports:
      - 8005:8000
    env_file:
      - path: docker-envs/torrent_search.env
        required: false
    environment:
      TORRENT_SEARCH_API_URL: http://torrent-search-api:8000
    <<: [*default-dns, *default-logging, *default-networks]

volumes:
  transmission_config:
  transmission_watch:
