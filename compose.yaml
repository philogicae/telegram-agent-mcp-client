name: telegram-agent-mcp-client

x-dns: &default-dns
  dns:
    - 9.9.9.9
    - 149.112.112.112
    - 2620:fe::fe
    - 2620:fe::9

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-networks: &default-networks
  networks:
    - ai-agent

networks:
  ai-agent:
    name: ai-agent
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
        - subnet: fd28:489c:c1d1::/64
          gateway: fd28:489c:c1d1::1

services:
  telegram-agent:
    container_name: telegram-agent
    build: .
    image: telegram-agent
    restart: unless-stopped
    command: telegram-agent-mcp-client --telegram
    init: true
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - CONFIG_DIR=/app/config
      - TZ=${TZ:-UTC}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${CONFIG_DIR:-./config}:/app/config
    <<: [*default-dns, *default-logging, *default-networks]
