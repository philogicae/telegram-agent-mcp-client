name: telegram-agent-mcp-client

x-dns: &default-dns
  dns:
    - 9.9.9.9
    - 149.112.112.112
    - 2620:fe::fe
    - 2620:fe::9

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-networks: &default-networks
  networks:
    - ai-agent

networks:
  ai-agent:
    name: ai-agent
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
        - subnet: fd28:489c:c1d1::/64
          gateway: fd28:489c:c1d1::1

services:
  telegram-agent:
    container_name: telegram-agent
    build: .
    image: telegram-agent
    restart: unless-stopped
    command: telegram-agent-mcp-client --telegram
    #depends_on:
    #  - neo4j-community
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - CONFIG_DIR=/app/config
      - TZ=${TZ:-UTC}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${CONFIG_DIR:-./config}:/app/config
    <<: [*default-dns, *default-logging, *default-networks]

  #neo4j-community:
  #  container_name: neo4j-community
  #  image: neo4j:5.26-community
  #  restart: unless-stopped
  #  #ports:
  #  #  - "7474:7474"
  #  #  - "7687:7687"
  #  environment:
  #    - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
  #    - NEO4J_PLUGINS=["apoc"]
  #    - NEO4J_server_jvm_additional="--add-modules=jdk.incubator.vector"
  #  volumes:
  #    - ${DATA_DIR:-./data}/neo4j:/data
  #  <<: [*default-dns, *default-logging, *default-networks]

  docs-ui:
    container_name: docs-ui
    build:
      context: ./docs_ui
      dockerfile: Dockerfile
    image: docs-ui
    restart: unless-stopped
    ports:
      - "4040:4040"
    env_file:
      - .env
    <<: [*default-dns, *default-logging, *default-networks]
    deploy:
      replicas: ${DOCS_UI_URL:+1}
